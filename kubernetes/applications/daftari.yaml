# Daftari is a public web app. Its repository owns the workload manifests; this
# Application makes the OCI cluster reconcile that declared state continuously.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: daftari
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/danieliyahu1/daftari.git
      targetRevision: HEAD
      path: deploy
    - repoURL: https://github.com/danieliyahu1/oci-k3s-starter.git
      targetRevision: HEAD
      path: kubernetes/manifests/daftari
  destination:
    server: https://kubernetes.default.svc
    namespace: daftari
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
