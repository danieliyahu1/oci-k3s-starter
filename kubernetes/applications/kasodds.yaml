# KasOdds owns its Kubernetes manifests in its deploy/ directory.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kasodds
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/danieliyahu1/kas-odds.git
    targetRevision: HEAD
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: kasodds
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
