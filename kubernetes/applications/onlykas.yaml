# OnlyKas owns its workload manifests in the application repository's deploy/ directory.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onlykas
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/danieliyahu1/onlykas.git
    targetRevision: master
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: onlykas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
