# LifeOS credentials come from OCI Vault, like every other app on this box.
#
# What is in Git: the NAME of each vault entry. What is never in Git: the values. The
# External Secrets operator, running under an instance principal, fetches them and writes
# the `lifeos-secrets` Secret that the Deployment consumes.
#
# The six vault entries (create them in the OCI console: Vault → Secrets → Create, plain
# text, or with `oci vault secret create-base64`):
#
#   lifeos-username           first-run sign-in name
#   lifeos-password           first-run sign-in password
#   lifeos-db-password        MySQL password for the `lifeos` user
#   lifeos-db-root-password   MySQL root password
#   lifeos-api-token          64 hex chars; also what the MCP server sends as a bearer token
#   lifeos-secret-key         encrypts saved mail app passwords and AI keys
#
# ⚠ `lifeos-username` / `lifeos-password` are FIRST-RUN ONLY: the account is written to
# MySQL on first boot and the env vars are ignored afterwards. Changing them in the vault
# later does nothing to the running app — use Settings → My account for that.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lifeos-secrets
  namespace: lifeos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: lifeos-secrets
    creationPolicy: Owner
  data:
    - secretKey: LIFEOS_USERNAME
      remoteRef:
        key: lifeos-username
    - secretKey: LIFEOS_PASSWORD
      remoteRef:
        key: lifeos-password
    - secretKey: LIFEOS_DB_PASSWORD
      remoteRef:
        key: lifeos-db-password
    - secretKey: LIFEOS_DB_ROOT_PASSWORD
      remoteRef:
        key: lifeos-db-root-password
    - secretKey: LIFEOS_API_TOKEN
      remoteRef:
        key: lifeos-api-token
    - secretKey: LIFEOS_SECRET_KEY
      remoteRef:
        key: lifeos-secret-key
