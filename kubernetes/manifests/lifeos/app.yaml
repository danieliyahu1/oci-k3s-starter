# Edi Life OS — PHP 8.3 + Apache, built and published by the upstream project.
#
# The image serves public_html as its web root and reads every setting from the
# environment (upstream docker/config.php), so nothing here is a fork of their config.
#
# Secrets are NOT in Git: `lifeos-secrets` is produced by the ExternalSecret in
# externalsecret.yaml from OCI Vault entries named lifeos-*. Rotating a value means
# changing it in the vault, force-syncing that ExternalSecret, and
# `kubectl rollout restart deploy/lifeos` — the env is read at start-up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifeos
  namespace: lifeos
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lifeos
  template:
    metadata:
      labels:
        app: lifeos
    spec:
      # www-data is uid/gid 33 in the Debian-based php image. The attachments volume is a
      # fresh directory on the node owned by root; without this the first upload fails with
      # a permission error that looks like an application bug.
      securityContext:
        fsGroup: 33
      containers:
        - name: app
          # Renovate's built-in kubernetes manager reads this tag. Do NOT add a
          # `# renovate:` comment above it: this repo's custom regex manager captures the
          # whole `repo:tag` as the version, and would write nonsense back into the file.
          image: ghcr.io/edrisranjbar/lifeos:1.2.0
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: lifeos-config
            - secretRef:
                name: lifeos-secrets
          volumeMounts:
            - name: attachments
              mountPath: /data/attachments
          # The image ships no dedicated health endpoint; this is the same check upstream's
          # compose healthcheck runs. A 3xx to /login.php counts as success.
          readinessProbe:
            httpGet:
              path: /login.php
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /login.php
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 384Mi
      volumes:
        - name: attachments
          persistentVolumeClaim:
            claimName: lifeos-attachments
---
# Cloudflare Tunnel points at http://lifeos.lifeos.svc.cluster.local:80
apiVersion: v1
kind: Service
metadata:
  name: lifeos
  namespace: lifeos
spec:
  selector:
    app: lifeos
  ports:
    - name: http
      port: 80
      targetPort: http
